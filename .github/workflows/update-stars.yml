name: Weekly Star Count Update

on:
  schedule:
    # Every Monday at 09:17 UTC (17:17 Beijing time)
    - cron: '17 9 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: weekly-star-count-update
  cancel-in-progress: false

jobs:
  update-stars:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run star count updater
        id: update
        run: python scripts/update_stars.py --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README updates
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md README_CN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: weekly star count update"
          git push origin HEAD:main
